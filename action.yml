name: Lowtide closeout gate
description: Fail the job while an engagement still has anything left behind (changes not rolled back and read back, credentials not contained, evidence not handed over).
branding: { icon: anchor, color: blue }
inputs:
  home: { description: "Folder that holds the engagement (config.json and journal/)", default: ".lowtide" }
  mode: { description: "check (default) or close (also writes the report, seal and pack)", default: "check" }
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        lowtide verify --home "${{ inputs.home }}"
        if [ "${{ inputs.mode }}" = "close" ]; then
          lowtide close --home "${{ inputs.home }}"
        else
          lowtide close --check --home "${{ inputs.home }}"
        fi
    - if: always() && inputs.mode == 'close'
      uses: actions/upload-artifact@v4
      with: { name: lowtide-closeout, path: "${{ inputs.home }}/reports" }
